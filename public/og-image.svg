<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand cream gradient background -->
    <linearGradient id="ogBgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FAF7F2"/>
      <stop offset="50%" style="stop-color:#F7F3EC"/>
      <stop offset="100%" style="stop-color:#F4EFE8"/>
    </linearGradient>

    <!-- Subtle warm glow -->
    <radialGradient id="warmGlow" cx="30%" cy="30%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" style="stop-color:rgba(255,250,240,0.6)"/>
      <stop offset="100%" style="stop-color:rgba(255,250,240,0)"/>
    </radialGradient>

    <!-- Soft glow behind logo -->
    <radialGradient id="logoGlow" cx="50%" cy="50%" r="30%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:rgba(74,74,74,0.03)"/>
      <stop offset="100%" style="stop-color:rgba(74,74,74,0)"/>
    </radialGradient>

    <!-- Subtle vignette for depth -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:rgba(0,0,0,0)"/>
      <stop offset="100%" style="stop-color:rgba(0,0,0,0.04)"/>
    </radialGradient>
  </defs>

  <!-- Base cream gradient background -->
  <rect width="1200" height="630" fill="url(#ogBgGradient)"/>

  <!-- Warm glow overlay -->
  <rect width="1200" height="630" fill="url(#warmGlow)"/>

  <!-- Soft glow behind logo -->
  <ellipse cx="600" cy="315" rx="150" ry="100" fill="url(#logoGlow)"/>

  <!-- Subtle vignette -->
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Logo mark v2 - centered with humble presence -->
  <!-- Original viewBox: 400x400, Target: ~160px for humble presence -->
  <!-- Scale: 0.4, Offset: (1200 - 160) / 2 = 520, (630 - 160) / 2 = 235 -->
  <g transform="translate(520, 235) scale(0.4)">
    <g transform="translate(0,400) scale(0.1,-0.1)" fill="#4A4A4A" fill-rule="nonzero">
      <path d="M622 3258 l3 -123 150 -6 c83 -3 180 -13 216 -22 217 -53 381 -142 534 -288 177 -170 273 -339 329 -579 12 -52 20 -102 19 -110 -3 -11 -33 -20 -106 -32 -133 -22 -267 -67 -398 -135 -137 -70 -253 -158 -365 -275 -144 -151 -244 -317 -309 -511 -44 -133 -64 -250 -72 -421 l-6 -139 174 6 c151 4 189 9 289 35 211 55 387 145 555 284 133 111 259 268 334 416 l32 63 36 -68 c64 -121 135 -216 248 -329 167 -168 339 -273 557 -343 133 -42 259 -61 411 -61 l127 0 0 119 0 118 -137 6 c-201 8 -329 39 -492 119 -97 48 -215 133 -293 211 -100 100 -192 234 -242 354 -33 79 -72 213 -81 280 l-7 52 49 6 c100 13 262 58 365 102 207 86 424 257 564 442 79 105 185 315 219 436 37 127 55 261 55 399 l0 119 -152 -6 c-233 -10 -409 -53 -593 -148 -210 -107 -391 -267 -523 -461 -17 -25 -49 -78 -71 -118 l-38 -71 -41 73 c-127 230 -311 418 -537 547 -207 119 -451 181 -708 181 l-98 0 3 -122z m2504 -155 c-2 -10 -8 -38 -11 -63 -20 -128 -101 -316 -193 -445 -103 -145 -265 -282 -426 -360 -96 -47 -226 -88 -313 -100 -41 -5 -53 -4 -53 7 1 32 40 188 63 248 51 136 132 270 229 375 65 72 176 161 266 214 118 70 318 139 405 140 32 1 38 -2 33 -16z m-1281 -1388 c-32 -125 -114 -296 -194 -403 -110 -145 -257 -264 -424 -342 -87 -41 -220 -83 -301 -95 l-49 -7 8 59 c9 74 47 197 91 292 79 171 222 342 377 449 136 94 321 170 466 191 44 6 46 5 49 -19 1 -14 -9 -70 -23 -125z"/>
    </g>
  </g>

  <!-- Subtle corner accents -->
  <rect x="40" y="40" width="50" height="1" fill="rgba(74,74,74,0.06)"/>
  <rect x="40" y="40" width="1" height="50" fill="rgba(74,74,74,0.06)"/>
  <rect x="1110" y="589" width="50" height="1" fill="rgba(74,74,74,0.06)"/>
  <rect x="1159" y="540" width="1" height="50" fill="rgba(74,74,74,0.06)"/>
